########################################
# Kafka - Bootstrap
########################################
spring.kafka.bootstrap-servers=localhost:9092


########################################
# Kafka Consumer Configuration
########################################
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.auto-commit-interval=1000


########################################
# Kafka Deserializers
########################################
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer


########################################
# JsonDeserializer Settings (CRITICAL)
########################################

# Producer disabled type headers, so consumer MUST NOT expect them
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Map topic -> event class (BEST PRACTICE)
spring.kafka.consumer.properties.spring.json.type.mapping=APPOINTMENT_CREATED:com.ztrios.opd_notification_service.dto.event.AppointmentCreatedEvent,APPOINTMENT_CONFIRMED:com.ztrios.opd_notification_service.dto.event.AppointmentConfirmedEvent

# Trust only your packages (DO NOT use "*" in prod)
spring.kafka.consumer.properties.spring.json.trusted.packages=com.opd.notification.dto.event


########################################
# Kafka Listener
########################################
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.listener.ack-mode=record


########################################
# Logging (Very Helpful for Kafka Debug)
########################################
logging.level.org.apache.kafka=INFO
logging.level.org.springframework.kafka=INFO
logging.level.com.opd.notification=DEBUG



# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Actuator Configuration
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.info.enabled=true
management.info.env.enabled=true

# Application Info for Eureka Dashboard
info.app.name=OPD Notification Service
info.app.description=Notification service for OPD Hospital System
info.app.version=1.0.0
