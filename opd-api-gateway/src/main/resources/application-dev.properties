# =============================
# Development Profile - Direct URLs (No Eureka Required)
# =============================

logging.level.org.springframework.cloud.gateway=DEBUG

# Disable Eureka for local development
eureka.client.enabled=false

# =============================
# Business API Routes
# =============================
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/auth(?<segment>/?.*), $\{segment}

spring.cloud.gateway.routes[1].id=doctor-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/doctors/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/doctors(?<segment>/?.*), $\{segment}

spring.cloud.gateway.routes[2].id=appointment-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/appointments/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/appointments(?<segment>/?.*), $\{segment}

spring.cloud.gateway.routes[3].id=billing-service
spring.cloud.gateway.routes[3].uri=http://localhost:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/billing/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/billing(?<segment>/?.*), $\{segment}

spring.cloud.gateway.routes[4].id=notification-service
spring.cloud.gateway.routes[4].uri=http://localhost:8085
