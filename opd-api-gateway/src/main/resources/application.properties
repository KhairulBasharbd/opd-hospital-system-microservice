spring.application.name=opd-api-gateway
server.port=8080

# JWT Configuration
security.jwt.secret=${JWT_SECRET:x9J3Q2vN8LpW6sY4DkF1hE2bR7uV5tM3qP9cT1zB8R6yK4J8N2L0U3W5X7Y9Z1A}

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG

# Disable Eureka for local development
eureka.client.enabled=false

# =============================
# Actuator Configuration
# =============================
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always

# Application Info
info.app.name=OPD API Gateway
info.app.description=API Gateway for OPD Hospital System
info.app.version=1.0.0

# =============================
# Springdoc OpenAPI Configuration
# =============================
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.disable-swagger-default-url=true

# Swagger UI Dropdown URLs
springdoc.swagger-ui.urls[0].url=/service/auth/v3/api-docs
springdoc.swagger-ui.urls[0].name=Auth Service

springdoc.swagger-ui.urls[1].url=/service/doctor/v3/api-docs
springdoc.swagger-ui.urls[1].name=Doctor Service

springdoc.swagger-ui.urls[2].url=/service/appointment/v3/api-docs
springdoc.swagger-ui.urls[2].name=Appointment Service

springdoc.swagger-ui.urls[3].url=/service/billing/v3/api-docs
springdoc.swagger-ui.urls[3].name=Billing Service

springdoc.swagger-ui.urls[4].url=/service/notification/v3/api-docs
springdoc.swagger-ui.urls[4].name=Notification Service

# =============================
# Spring Cloud Gateway Routes (NEW FORMAT for Spring Cloud 2025 WebFlux)
# =============================

# Swagger API Docs Routes - MUST come first (more specific paths)
spring.cloud.gateway.server.webflux.routes[0].id=auth-api-docs
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/service/auth/v3/api-docs
spring.cloud.gateway.server.webflux.routes[0].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.server.webflux.routes[1].id=doctor-api-docs
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/service/doctor/v3/api-docs
spring.cloud.gateway.server.webflux.routes[1].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.server.webflux.routes[2].id=appointment-api-docs
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/service/appointment/v3/api-docs
spring.cloud.gateway.server.webflux.routes[2].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.server.webflux.routes[3].id=billing-api-docs
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/service/billing/v3/api-docs
spring.cloud.gateway.server.webflux.routes[3].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.server.webflux.routes[4].id=notification-api-docs
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/service/notification/v3/api-docs
spring.cloud.gateway.server.webflux.routes[4].filters[0]=SetPath=/v3/api-docs

# Business API Routes
spring.cloud.gateway.server.webflux.routes[5].id=auth-service
spring.cloud.gateway.server.webflux.routes[5].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/auth/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[6].id=doctor-service
spring.cloud.gateway.server.webflux.routes[6].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/doctors/**
spring.cloud.gateway.server.webflux.routes[6].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[7].id=appointment-service
spring.cloud.gateway.server.webflux.routes[7].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/appointments/**
spring.cloud.gateway.server.webflux.routes[7].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[8].id=billing-service
spring.cloud.gateway.server.webflux.routes[8].uri=http://localhost:8084
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/billing/**
spring.cloud.gateway.server.webflux.routes[8].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[9].id=notification-service
spring.cloud.gateway.server.webflux.routes[9].uri=http://localhost:8085
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/notifications/**
spring.cloud.gateway.server.webflux.routes[9].filters[0]=StripPrefix=1
