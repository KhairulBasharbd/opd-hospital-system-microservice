services:
  postgres:
    image: postgres:16
    container_name: opd-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - opd-net

  mongo:
    image: mongo:7
    container_name: opd-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - opd-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: opd-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - opd-net

  redis:
    image: redis:7
    container_name: opd-redis
    ports:
      - "6379:6379"
    networks:
      - opd-net

  kafka:
    image: apache/kafka:4.0.0
    container_name: opd-kafka
    ports:
      - "9092:9092"
    networks:
      - opd-net
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_CLUSTER_ID: opd-cluster-1

      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@opd-kafka:9093

      # LISTENERS
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://opd-kafka:29092,EXTERNAL://localhost:9092


      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # 🔴 🔴 🔴 THIS IS THE FIX 🔴 🔴 🔴
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1

      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data


  redpanda-console:
    image: redpandadata/console:v3.3.2
    container_name: opd-redpanda-console
    depends_on:
      - kafka
    ports:
      - "8089:8080"
    environment:
      KAFKA_BROKERS: opd-kafka:29092
    networks:
      - opd-net

networks:
  opd-net:

volumes:
  postgres_data:
  mongo_data:
  pgadmin_data:
  kafka_data:
